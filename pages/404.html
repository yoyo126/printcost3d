<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintCost 3D a déménagé</title>
<style>
:root{--bg:#f6f4fc;--card:#fff;--ink:#1b1830;--muted:#6f6a86;--brand:#6c4cff}
@media (prefers-color-scheme:dark){:root{--bg:#100e1a;--card:#1b1830;--ink:#f1eefc;--muted:#a49fbd;--brand:#9a84ff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;box-sizing:border-box}
.c{max-width:440px;background:var(--card);border-radius:24px;padding:26px;box-shadow:0 10px 30px #0002;text-align:center}
h1{font-size:22px;margin:0 0 8px}p{color:var(--muted);line-height:1.5}
a.b,button{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:14px;border:0;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
a.b{background:linear-gradient(135deg,#6c4cff,#a14dff,#ff5c93);color:#fff}button{background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<div class="c">
  <h1>PrintCost 3D a déménagé</h1>
  <p id="msg">Redirection vers la nouvelle adresse…</p>
  <button id="dl" hidden>⬇︎ Télécharger mes données de cette ancienne adresse</button>
  <a class="b" id="go" href="https://printcost3d-gamma.vercel.app/">Aller sur printcost3d-gamma.vercel.app</a>
</div>
<script>
const NEW = 'https://printcost3d-gamma.vercel.app/';
let data = null;
try { data = JSON.parse(localStorage.getItem('pc3d-v2') || 'null'); } catch {}
const has = data && ['models', 'spools', 'sales', 'prints'].some(k => (data[k] || []).length);
if (!has) location.replace(NEW);
else {
  document.getElementById('msg').textContent = 'Ce navigateur garde encore des données saisies sur l’ancienne adresse. Télécharge-les, puis importe-les dans la nouvelle version (Réglages › Importer).';
  const dl = document.getElementById('dl'); dl.hidden = false;
  dl.onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}));
    a.download = 'printcost3d-ancienne-adresse-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  };
}
</script>
</body>
</html>
