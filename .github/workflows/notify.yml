# Vérifie toutes les ~5 min si une impression Bambu vient de se terminer, et envoie la notification sur le téléphone
name: Notifications impressions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 "https://printcost3d-gamma.vercel.app/api/push?check=1"
